<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Dzień na Lotnisku — AI w Akcji</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-papkin: #7c3aed;
      --c-papkin-light: #a78bfa;
      --c-protazy: #ea580c;
      --c-protazy-light: #fb923c;
      --c-gerwazy: #1d4ed8;
      --c-gerwazy-light: #60a5fa;
      --c-bg: #0f0f1a;
      --c-sky: #1e3a5f;
      --c-ground: #2d4a22;
      --c-amber: #f59e0b;
      --c-text: #f0e6d3;
      --c-panel-bg: #1a1a2e;
      --c-panel-border: #f59e0b;
      --font: 'Press Start 2P', monospace;
      --scene-w: 1920px;
      --scene-h: 860px;
      --header-h: 80px;
      --nav-h: 60px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--c-bg);
      font-family: var(--font);
      color: var(--c-text);
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      user-select: none;
    }

    #app {
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      height: var(--header-h);
      background: linear-gradient(180deg, #0a0a14 0%, #111128 100%);
      border-bottom: 3px solid var(--c-amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
    }

    #title-bar {
      font-size: 14px;
      color: var(--c-amber);
      letter-spacing: 2px;
    }

    #clock-display {
      font-size: 28px;
      color: #ffffff;
      text-shadow: 0 0 12px var(--c-amber);
    }

    #header-controls {
      display: flex;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: 2px solid var(--c-amber);
      color: var(--c-amber);
      font-family: var(--font);
      font-size: 12px;
      padding: 8px 12px;
      cursor: pointer;
      image-rendering: pixelated;
    }
    .ctrl-btn:hover { background: var(--c-amber); color: #000; }

    /* SCENE VIEWPORT */
    #scene-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #scenes-track {
      display: flex;
      width: calc(1920px * 6);
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scene {
      width: 1920px;
      height: 100%;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* NAV BAR */
    #nav-bar {
      height: var(--nav-h);
      background: linear-gradient(180deg, #111128 0%, #0a0a14 100%);
      border-top: 3px solid var(--c-amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: none;
      border: 3px solid var(--c-amber);
      color: var(--c-amber);
      font-family: var(--font);
      font-size: 16px;
      padding: 8px 24px;
      cursor: pointer;
      min-width: 160px;
    }
    .nav-btn:hover { background: var(--c-amber); color: #000; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    #scene-dots {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .scene-dot {
      width: 24px;
      height: 24px;
      border: 3px solid var(--c-amber);
      background: transparent;
      cursor: pointer;
      image-rendering: pixelated;
      transition: background 0.2s;
    }
    .scene-dot.active { background: var(--c-amber); }
    .scene-dot:hover { background: rgba(245,158,11,0.5); }

    /* ============================================================
       SCENE BACKGROUNDS
       ============================================================ */

    /* Scena 1: Terminal lotniska (ciepły amber, okna na niebo) */
    .scene-1 {
      background: linear-gradient(180deg, #1e3a5f 0%, #2d5f8f 30%, #c8a96e 30%, #d4b483 60%, #8b7355 60%, #6b5a42 100%);
    }

    /* Okna w terminalu (scena 1) */
    .scene-1::before {
      content: '';
      position: absolute;
      top: 80px;
      left: 0; right: 0;
      height: 200px;
      background:
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 80px 0 / 180px 160px no-repeat,
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 320px 0 / 180px 160px no-repeat,
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 560px 0 / 180px 160px no-repeat,
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 900px 0 / 280px 160px no-repeat,
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 1240px 0 / 280px 160px no-repeat,
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 1580px 0 / 180px 160px no-repeat,
        linear-gradient(180deg, #87ceeb 0%, #4a9eca 100%) 1740px 0 / 100px 160px no-repeat;
      border-bottom: 8px solid #8b7355;
    }

    /* Scena 2: Sala konferencyjna (granatowa, profesjonalna) */
    .scene-2 {
      background: linear-gradient(180deg, #1e293b 0%, #334155 40%, #6b5a42 40%, #8b7355 70%, #4a3728 70%, #2d1f0f 100%);
    }

    /* Scena 3: Biuro open space (jasne, nowoczesne) */
    .scene-3 {
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 35%, #e2e8f0 35%, #cbd5e1 65%, #94a3b8 65%, #64748b 100%);
    }
    /* Override text color for bright scene */
    .scene-3 .info-panel { --c-text: #0f172a; }

    /* Scena 4: Centrum kontroli/compliance (ciemne, poważne) */
    .scene-4 {
      background: linear-gradient(180deg, #0f172a 0%, #1e2d4f 40%, #2d3748 40%, #374151 70%, #1f2937 70%, #111827 100%);
    }

    /* Scena 5: Gabinet dyrektora (elegancki, ciemne drewno) */
    .scene-5 {
      background: linear-gradient(180deg, #1c1410 0%, #2d1f0f 50%, #3d2b1a 50%, #4a3728 80%, #2d1f0f 80%, #1c1410 100%);
    }

    /* Scena 6: Lotnisko nocą */
    .scene-6 {
      background: linear-gradient(180deg, #020617 0%, #0c1445 40%, #1e3a5f 40%, #0f2540 70%, #1a1a2e 70%, #0a0a14 100%);
    }

    /* Gwiazdy nocą (scena 6) */
    .scene-6::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      background-image:
        radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 8%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 40% 20%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 12%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 5%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 80% 18%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 30%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 25%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 85% 35%, #fff 0%, transparent 100%);
    }

    /* ============================================================
       INFO PANEL (wyjeżdża z prawej)
       ============================================================ */
    .info-panel {
      position: absolute;
      right: -480px;
      top: 50%;
      transform: translateY(-50%);
      width: 440px;
      background: var(--c-panel-bg, #1a1a2e);
      border: 4px solid var(--c-panel-border, #f59e0b);
      padding: 24px;
      transition: right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
      image-rendering: pixelated;
    }
    .info-panel.visible { right: 24px; }

    .panel-product {
      font-size: 16px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .panel-tagline {
      font-size: 9px;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.8;
    }
    .panel-bullets {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .panel-bullets li {
      font-size: 8px;
      line-height: 2;
      padding-left: 16px;
      position: relative;
      color: var(--c-text, #f0e6d3);
      margin-bottom: 8px;
    }
    .panel-bullets li::before {
      content: '▶';
      position: absolute;
      left: 0;
      font-size: 8px;
    }

    /* ============================================================
       CHAOS LABEL (eksplodujący problem)
       ============================================================ */
    .chaos-label {
      position: absolute;
      background: #dc2626;
      color: #fff;
      font-family: var(--font);
      font-size: 11px;
      padding: 8px 16px;
      border: 3px solid #fca5a5;
      animation: shake 0.2s infinite alternate;
      z-index: 5;
    }

    @keyframes shake {
      0%   { transform: rotate(-2deg) scale(1); }
      100% { transform: rotate(2deg) scale(1.05); }
    }

    /* ============================================================
       SCENE TITLE (na wejściu)
       ============================================================ */
    .scene-title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: var(--c-amber);
      text-shadow: 0 0 16px var(--c-amber);
      white-space: nowrap;
      letter-spacing: 3px;
      z-index: 10;
    }

    /* ============================================================
       FLOATING PARTICLES (emoji lecące w powietrze)
       ============================================================ */
    .particle {
      position: absolute;
      font-size: 20px;
      animation: float-up 2s ease-out forwards;
      pointer-events: none;
      z-index: 20;
    }
    @keyframes float-up {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-150px) rotate(360deg); }
    }

    /* ============================================================
       STAR BURST (win effect)
       ============================================================ */
    .star-burst {
      position: absolute;
      font-size: 28px;
      animation: burst 0.8s ease-out forwards;
      pointer-events: none;
      z-index: 20;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: scale(0) rotate(0deg); }
      50%  { opacity: 1; transform: scale(1.5) rotate(180deg); }
      100% { opacity: 0; transform: scale(2) rotate(360deg); }
    }

    /* ============================================================
       OUTRO COUNTERS
       ============================================================ */
    .outro-counter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .counter-value {
      font-size: 36px;
      text-shadow: 0 0 20px currentColor;
    }
    .counter-label {
      font-size: 9px;
      text-align: center;
      line-height: 1.8;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title-bar">DZIEŃ NA LOTNISKU</div>
      <div id="clock-display">06:30</div>
      <div id="header-controls">
        <button class="ctrl-btn" id="btn-sound">🔇 DŹWIĘK</button>
        <button class="ctrl-btn" id="btn-fullscreen">⛶ PEŁNY EKRAN</button>
        <button class="ctrl-btn" id="btn-restart">↺ OD POCZĄTKU</button>
      </div>
    </div>
    <div id="scene-viewport">
      <div id="scenes-track">
        <div class="scene scene-1" id="scene-1"></div>
        <div class="scene scene-2" id="scene-2"></div>
        <div class="scene scene-3" id="scene-3"></div>
        <div class="scene scene-4" id="scene-4"></div>
        <div class="scene scene-5" id="scene-5"></div>
        <div class="scene scene-6" id="scene-6"></div>
      </div>
    </div>
    <div id="nav-bar">
      <button class="nav-btn" id="btn-prev">← WSTECZ</button>
      <div id="scene-dots">
        <div class="scene-dot active" data-scene="0" title="Intro"></div>
        <div class="scene-dot" data-scene="1" title="Papkin"></div>
        <div class="scene-dot" data-scene="2" title="Protazy"></div>
        <div class="scene-dot" data-scene="3" title="Gerwazy"></div>
        <div class="scene-dot" data-scene="4" title="Dyrektor"></div>
        <div class="scene-dot" data-scene="5" title="Outro"></div>
      </div>
      <button class="nav-btn" id="btn-next">DALEJ →</button>
    </div>
  </div>
  <script>
    // ============================================================
    // SPRITE RENDERER
    // ============================================================

    const PIXEL_SCALE = 8;

    const PALETTES = {
      papkin: {
        '1': '#7c3aed', // fioletowe ubranie
        'H': '#a78bfa', // słuchawki (jasny fiolet)
        'S': '#fde68a', // skóra
        'E': '#312e81', // oczy (ciemny fiolet)
        'L': '#6ee7b7', // ekran laptopa (zielony blask)
        'G': '#4b5563', // obudowa laptopa (szary)
        'W': '#ffffff', // biały (guziki koszuli)
        '.': null,
      },
      protazy: {
        '2': '#ea580c', // pomarańczowy garnitur
        'D': '#c2410c', // ciemny pomarańcz (cień)
        'S': '#fde68a', // skóra
        'E': '#7c2d12', // oczy
        'T': '#fbbf24', // krawat/żółty
        'V': '#ffffff', // biała koszula
        'B': '#f97316', // jasny pomarańcz
        '.': null,
      },
      gerwazy: {
        '3': '#1d4ed8', // niebieski garnitur
        'D': '#1e3a8a', // ciemny niebieski
        'S': '#fde68a', // skóra
        'E': '#374151', // okulary (ciemny)
        'K': '#93c5fd', // szkła okularów
        'B': '#fbbf24', // odznaka (złota)
        'T': '#f0f9ff', // tablet
        '.': null,
      },
    };

    // Każda klatka to tablica stringów 8-znakowich (8 cols × 14 rows)
    // Skala: PIXEL_SCALE px per pixel = 64×112 px per sprite
    const CHAR_FRAMES = {
      papkin: {
        idle_a: [
          '_HH__HH_',
          '_H1111H_',
          '__1SS1__',
          '__1EE1__',
          '__1SS1__',
          '_111111_',
          '_1WLLW1_',
          '_1WLLW1_',
          '_1WGGG1_',
          '_111111_',
          '___11___',
          '___11___',
          '__11_1__',
          '__1__1__',
        ],
        idle_b: [
          '_HH__HH_',
          '_H1111H_',
          '__1SS1__',
          '__1EE1__',
          '__1SS1__',
          '_111111_',
          '_1WLLW1_',
          '_1WLLW1_',
          '_1WGGG1_',
          '_111111_',
          '___11___',
          '___11___',
          '__1__11_',
          '__1__1__',
        ],
        action: [
          '_HH__HH_',
          '_H1111H_',
          '__1SS1__',
          '__1EE1__',
          '__1SS1__',
          '11111111',
          '1LWLLWL1',  // arms wide open, laptop glowing
          '1LWLLWL1',
          '1LGGGGL1',
          '_111111_',
          '___11___',
          '___11___',
          '__11_1__',
          '__1__1__',
        ],
        win: [
          '_HH__HH_',
          '1H1111H1',  // arms raised
          '__1SS1__',
          '__1OO1__',  // O = big eyes (excited)
          '__1vv1__',  // v = smile
          '_111111_',
          '_1WLLW1_',
          '_1WLLW1_',
          '_1WGGG1_',
          '_111111_',
          '__11_1__',
          '__1__1__',
          '__1__1__',
          '________',
        ],
      },
      protazy: {
        idle_a: [
          '__2222__',
          '_222222_',
          '_2SSSS2_',
          '_2SEES2_',  // S=skin, E=eye
          '_2SSSS2_',
          '_222222_',
          '_2VTTV2_',  // V=white shirt, T=tie
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '___22___',
          '__22_2__',
          '__2__2__',
        ],
        idle_b: [
          '__2222__',
          '_222222_',
          '_2SSSS2_',
          '_2SEES2_',
          '_2SSSS2_',
          '_222222_',
          '_2VTTV2_',
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '___22___',
          '__2__22_',
          '__2__2__',
        ],
        action: [
          '__2222__',
          '_222222_',
          '_2SSSS2_',
          '_2SEES2_',
          '_2SSSS2_',
          '22222222',  // arms wide - sorting mail!
          '2BVTTV B2', // B = buttons
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '___22___',
          '__22_2__',
          '__2__2__',
        ],
        win: [
          '__2222__',
          '2_2222_2',  // hands up
          '_2SSSS2_',
          '_2SeEs2_',  // e = happy squint
          '_2S^^S2_',  // ^ = smile
          '_222222_',
          '_2VTTV2_',
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '__22_2__',
          '__2__2__',
          '________',
        ],
      },
      gerwazy: {
        idle_a: [
          '__3333__',
          '_333333_',
          '_3SSSS3_',
          '_3EKKE3_',  // E=glasses frame, K=lens
          '_3SSSS3_',
          '_333333_',
          '_3BTBT3_',  // B=badge, T=tablet
          '_3BTBT3_',
          '_333333_',
          '_333333_',
          '___33___',
          '___33___',
          '__33_3__',
          '__3__3__',
        ],
        idle_b: [
          '__3333__',
          '_333333_',
          '_3SSSS3_',
          '_3EKKE3_',
          '_3SSSS3_',
          '_333333_',
          '_3BTBT3_',
          '_3BTBT3_',
          '_333333_',
          '_333333_',
          '___33___',
          '___33___',
          '__3__33_',
          '__3__3__',
        ],
        action: [
          '__3333__',
          '_333333_',
          '_3SSSS3_',
          '_3EKKE3_',
          '_3SSSS3_',
          '33333333',  // arms wide - scanning documents
          '3BTTTBT3',
          '3BTTTBT3',
          '_333333_',
          '_333333_',
          '___33___',
          '___33___',
          '__33_3__',
          '__3__3__',
        ],
        win: [
          '__3333__',
          '3_3333_3',  // arms raised
          '_3SSSS3_',
          '_3EKKE3_',
          '_3S^^S3_',  // smile
          '_333333_',
          '_3BTBT3_',
          '_3BTBT3_',
          '_333333_',
          '_333333_',
          '___33___',
          '__33_3__',
          '__3__3__',
          '________',
        ],
      },
    };

    // Extra color overrides per frame
    const EXTRA_COLORS = {
      papkin: { 'O': '#f59e0b', 'v': '#f87171', 'W': '#ffffff' },
      protazy: { 'e': '#7c2d12', '^': '#dc2626', 'B': '#c2410c' },
      gerwazy: { '^': '#dc2626' },
    };

    /**
     * Draws a sprite frame onto a canvas context.
     * @param {CanvasRenderingContext2D} ctx
     * @param {string} charKey - 'papkin' | 'protazy' | 'gerwazy'
     * @param {string} frameKey - e.g. 'idle_a', 'action', 'win'
     * @param {number} x - top-left x in canvas pixels
     * @param {number} y - top-left y in canvas pixels
     * @param {number} scale - pixels per pixel (default PIXEL_SCALE)
     */
    function drawSprite(ctx, charKey, frameKey, x, y, scale = PIXEL_SCALE) {
      const frame = CHAR_FRAMES[charKey][frameKey];
      const palette = { ...PALETTES[charKey], ...(EXTRA_COLORS[charKey] || {}) };
      frame.forEach((row, rowIdx) => {
        for (let colIdx = 0; colIdx < row.length; colIdx++) {
          const ch = row[colIdx];
          const color = palette[ch];
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(x + colIdx * scale, y + rowIdx * scale, scale, scale);
        }
      });
    }

    /**
     * Creates a canvas element with a sprite drawn on it.
     * @param {string} charKey
     * @param {string} frameKey
     * @param {number} scale
     * @returns {HTMLCanvasElement}
     */
    function makeSprite(charKey, frameKey, scale = PIXEL_SCALE) {
      const cols = 8;
      const rows = CHAR_FRAMES[charKey][frameKey].length;
      const canvas = document.createElement('canvas');
      canvas.width = cols * scale;
      canvas.height = rows * scale;
      canvas.style.imageRendering = 'pixelated';
      const ctx = canvas.getContext('2d');
      drawSprite(ctx, charKey, frameKey, 0, 0, scale);
      return canvas;
    }

    /**
     * Animated sprite component.
     * @param {string} charKey
     * @param {string[]} frameKeys - cycles through these frames
     * @param {number} fps
     * @param {number} scale
     * @returns {{ el: HTMLCanvasElement, stop: Function, setFrames: Function }}
     */
    function createAnimatedSprite(charKey, frameKeys, fps = 4, scale = PIXEL_SCALE) {
      const cols = 8;
      const rows = CHAR_FRAMES[charKey][frameKeys[0]].length;
      const canvas = document.createElement('canvas');
      canvas.width = cols * scale;
      canvas.height = rows * scale;
      canvas.style.imageRendering = 'pixelated';
      canvas.style.position = 'absolute';
      const ctx = canvas.getContext('2d');

      let currentFrames = frameKeys;
      let frameIdx = 0;
      let lastTime = 0;
      let rafId = null;
      let running = true;

      function tick(timestamp) {
        if (!running) return;
        if (timestamp - lastTime > 1000 / fps) {
          lastTime = timestamp;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawSprite(ctx, charKey, currentFrames[frameIdx % currentFrames.length], 0, 0, scale);
          frameIdx++;
        }
        rafId = requestAnimationFrame(tick);
      }

      rafId = requestAnimationFrame(tick);

      return {
        el: canvas,
        stop() { running = false; cancelAnimationFrame(rafId); },
        setFrames(newFrames) { currentFrames = newFrames; frameIdx = 0; },
        resume() { running = true; rafId = requestAnimationFrame(tick); },
