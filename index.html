<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Dzień na Lotnisku — AI w Akcji</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-papkin: #7c3aed;
      --c-papkin-light: #a78bfa;
      --c-protazy: #ea580c;
      --c-protazy-light: #fb923c;
      --c-gerwazy: #1d4ed8;
      --c-gerwazy-light: #60a5fa;
      --c-bg: #0f0f1a;
      --c-sky: #1e3a5f;
      --c-ground: #2d4a22;
      --c-amber: #f59e0b;
      --c-text: #f0e6d3;
      --c-panel-bg: #1a1a2e;
      --c-panel-border: #f59e0b;
      --font: 'Press Start 2P', monospace;
      --scene-w: 1920px;
      --scene-h: 860px;
      --header-h: 80px;
      --nav-h: 60px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--c-bg);
      font-family: var(--font);
      color: var(--c-text);
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      user-select: none;
    }

    #app {
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      height: var(--header-h);
      background: linear-gradient(180deg, #0a0a14 0%, #111128 100%);
      border-bottom: 3px solid var(--c-amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
    }

    #title-bar {
      font-size: 14px;
      color: var(--c-amber);
      letter-spacing: 2px;
    }

    #clock-display {
      font-size: 28px;
      color: #ffffff;
      text-shadow: 0 0 12px var(--c-amber);
    }

    #header-controls {
      display: flex;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: 2px solid var(--c-amber);
      color: var(--c-amber);
      font-family: var(--font);
      font-size: 12px;
      padding: 8px 12px;
      cursor: pointer;
      image-rendering: pixelated;
    }
    .ctrl-btn:hover { background: var(--c-amber); color: #000; }

    /* SCENE VIEWPORT */
    #scene-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #scenes-track {
      display: flex;
      width: calc(1920px * 6);
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scene {
      width: 1920px;
      height: 100%;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* NAV BAR */
    #nav-bar {
      height: var(--nav-h);
      background: linear-gradient(180deg, #111128 0%, #0a0a14 100%);
      border-top: 3px solid var(--c-amber);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: none;
      border: 3px solid var(--c-amber);
      color: var(--c-amber);
      font-family: var(--font);
      font-size: 16px;
      padding: 8px 24px;
      cursor: pointer;
      min-width: 160px;
    }
    .nav-btn:hover { background: var(--c-amber); color: #000; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    #scene-dots {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .scene-dot {
      width: 24px;
      height: 24px;
      border: 3px solid var(--c-amber);
      background: transparent;
      cursor: pointer;
      image-rendering: pixelated;
      transition: background 0.2s;
    }
    .scene-dot.active { background: var(--c-amber); }
    .scene-dot:hover { background: rgba(245,158,11,0.5); }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title-bar">DZIEŃ NA LOTNISKU</div>
      <div id="clock-display">06:30</div>
      <div id="header-controls">
        <button class="ctrl-btn" id="btn-sound">🔇 DŹWIĘK</button>
        <button class="ctrl-btn" id="btn-fullscreen">⛶ PEŁNY EKRAN</button>
        <button class="ctrl-btn" id="btn-restart">↺ OD POCZĄTKU</button>
      </div>
    </div>
    <div id="scene-viewport">
      <div id="scenes-track">
        <div class="scene scene-1" id="scene-1"></div>
        <div class="scene scene-2" id="scene-2"></div>
        <div class="scene scene-3" id="scene-3"></div>
        <div class="scene scene-4" id="scene-4"></div>
        <div class="scene scene-5" id="scene-5"></div>
        <div class="scene scene-6" id="scene-6"></div>
      </div>
    </div>
    <div id="nav-bar">
      <button class="nav-btn" id="btn-prev">← WSTECZ</button>
      <div id="scene-dots">
        <div class="scene-dot active" data-scene="0" title="Intro"></div>
        <div class="scene-dot" data-scene="1" title="Papkin"></div>
        <div class="scene-dot" data-scene="2" title="Protazy"></div>
        <div class="scene-dot" data-scene="3" title="Gerwazy"></div>
        <div class="scene-dot" data-scene="4" title="Dyrektor"></div>
        <div class="scene-dot" data-scene="5" title="Outro"></div>
      </div>
      <button class="nav-btn" id="btn-next">DALEJ →</button>
    </div>
  </div>
  <script>
    // ============================================================
    // SPRITE RENDERER
    // ============================================================

    const PIXEL_SCALE = 8;

    const PALETTES = {
      papkin: {
        '1': '#7c3aed', // fioletowe ubranie
        'H': '#a78bfa', // słuchawki (jasny fiolet)
        'S': '#fde68a', // skóra
        'E': '#312e81', // oczy (ciemny fiolet)
        'L': '#6ee7b7', // ekran laptopa (zielony blask)
        'G': '#4b5563', // obudowa laptopa (szary)
        'W': '#ffffff', // biały (guziki koszuli)
        '.': null,
      },
      protazy: {
        '2': '#ea580c', // pomarańczowy garnitur
        'D': '#c2410c', // ciemny pomarańcz (cień)
        'S': '#fde68a', // skóra
        'E': '#7c2d12', // oczy
        'T': '#fbbf24', // krawat/żółty
        'V': '#ffffff', // biała koszula
        'B': '#f97316', // jasny pomarańcz
        '.': null,
      },
      gerwazy: {
        '3': '#1d4ed8', // niebieski garnitur
        'D': '#1e3a8a', // ciemny niebieski
        'S': '#fde68a', // skóra
        'E': '#374151', // okulary (ciemny)
        'K': '#93c5fd', // szkła okularów
        'B': '#fbbf24', // odznaka (złota)
        'T': '#f0f9ff', // tablet
        '.': null,
      },
    };

    // Każda klatka to tablica stringów 8-znakowich (8 cols × 14 rows)
    // Skala: PIXEL_SCALE px per pixel = 64×112 px per sprite
    const CHAR_FRAMES = {
      papkin: {
        idle_a: [
          '_HH__HH_',
          '_H1111H_',
          '__1SS1__',
          '__1EE1__',
          '__1SS1__',
          '_111111_',
          '_1WLLW1_',
          '_1WLLW1_',
          '_1WGGG1_',
          '_111111_',
          '___11___',
          '___11___',
          '__11_1__',
          '__1__1__',
        ],
        idle_b: [
          '_HH__HH_',
          '_H1111H_',
          '__1SS1__',
          '__1EE1__',
          '__1SS1__',
          '_111111_',
          '_1WLLW1_',
          '_1WLLW1_',
          '_1WGGG1_',
          '_111111_',
          '___11___',
          '___11___',
          '__1__11_',
          '__1__1__',
        ],
        action: [
          '_HH__HH_',
          '_H1111H_',
          '__1SS1__',
          '__1EE1__',
          '__1SS1__',
          '11111111',
          '1LWLLWL1',  // arms wide open, laptop glowing
          '1LWLLWL1',
          '1LGGGGL1',
          '_111111_',
          '___11___',
          '___11___',
          '__11_1__',
          '__1__1__',
        ],
        win: [
          '_HH__HH_',
          '1H1111H1',  // arms raised
          '__1SS1__',
          '__1OO1__',  // O = big eyes (excited)
          '__1vv1__',  // v = smile
          '_111111_',
          '_1WLLW1_',
          '_1WLLW1_',
          '_1WGGG1_',
          '_111111_',
          '__11_1__',
          '__1__1__',
          '__1__1__',
          '________',
        ],
      },
      protazy: {
        idle_a: [
          '__2222__',
          '_222222_',
          '_2SSSS2_',
          '_2SEES2_',  // S=skin, E=eye
          '_2SSSS2_',
          '_222222_',
          '_2VTTV2_',  // V=white shirt, T=tie
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '___22___',
          '__22_2__',
          '__2__2__',
        ],
        idle_b: [
          '__2222__',
          '_222222_',
          '_2SSSS2_',
          '_2SEES2_',
          '_2SSSS2_',
          '_222222_',
          '_2VTTV2_',
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '___22___',
          '__2__22_',
          '__2__2__',
        ],
        action: [
          '__2222__',
          '_222222_',
          '_2SSSS2_',
          '_2SEES2_',
          '_2SSSS2_',
          '22222222',  // arms wide - sorting mail!
          '2BVTTV B2', // B = buttons
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '___22___',
          '__22_2__',
          '__2__2__',
        ],
        win: [
          '__2222__',
          '2_2222_2',  // hands up
          '_2SSSS2_',
          '_2SeEs2_',  // e = happy squint
          '_2S^^S2_',  // ^ = smile
          '_222222_',
          '_2VTTV2_',
          '_2VTTV2_',
          '_222222_',
          '_222222_',
          '___22___',
          '__22_2__',
          '__2__2__',
          '________',
        ],
      },
      gerwazy: {
        idle_a: [
          '__3333__',
          '_333333_',
          '_3SSSS3_',
          '_3EKKE3_',  // E=glasses frame, K=lens
          '_3SSSS3_',
          '_333333_',
          '_3BTBT3_',  // B=badge, T=tablet
          '_3BTBT3_',
          '_333333_',
          '_333333_',
          '___33___',
          '___33___',
          '__33_3__',
          '__3__3__',
        ],
        idle_b: [
          '__3333__',
          '_333333_',
          '_3SSSS3_',
          '_3EKKE3_',
          '_3SSSS3_',
          '_333333_',
          '_3BTBT3_',
          '_3BTBT3_',
          '_333333_',
          '_333333_',
          '___33___',
          '___33___',
          '__3__33_',
          '__3__3__',
        ],
        action: [
          '__3333__',
          '_333333_',
          '_3SSSS3_',
          '_3EKKE3_',
          '_3SSSS3_',
          '33333333',  // arms wide - scanning documents
          '3BTTTBT3',
          '3BTTTBT3',
          '_333333_',
          '_333333_',
          '___33___',
          '___33___',
          '__33_3__',
          '__3__3__',
        ],
        win: [
          '__3333__',
          '3_3333_3',  // arms raised
          '_3SSSS3_',
          '_3EKKE3_',
          '_3S^^S3_',  // smile
          '_333333_',
          '_3BTBT3_',
          '_3BTBT3_',
          '_333333_',
          '_333333_',
          '___33___',
          '__33_3__',
          '__3__3__',
          '________',
        ],
      },
    };

    // Extra color overrides per frame
    const EXTRA_COLORS = {
      papkin: { 'O': '#f59e0b', 'v': '#f87171', 'W': '#ffffff' },
      protazy: { 'e': '#7c2d12', '^': '#dc2626', 'B': '#c2410c' },
      gerwazy: { '^': '#dc2626' },
    };

    /**
     * Draws a sprite frame onto a canvas context.
     * @param {CanvasRenderingContext2D} ctx
     * @param {string} charKey - 'papkin' | 'protazy' | 'gerwazy'
     * @param {string} frameKey - e.g. 'idle_a', 'action', 'win'
     * @param {number} x - top-left x in canvas pixels
     * @param {number} y - top-left y in canvas pixels
     * @param {number} scale - pixels per pixel (default PIXEL_SCALE)
     */
    function drawSprite(ctx, charKey, frameKey, x, y, scale = PIXEL_SCALE) {
      const frame = CHAR_FRAMES[charKey][frameKey];
      const palette = { ...PALETTES[charKey], ...(EXTRA_COLORS[charKey] || {}) };
      frame.forEach((row, rowIdx) => {
        for (let colIdx = 0; colIdx < row.length; colIdx++) {
          const ch = row[colIdx];
          const color = palette[ch];
          if (!color) continue;
          ctx.fillStyle = color;
          ctx.fillRect(x + colIdx * scale, y + rowIdx * scale, scale, scale);
        }
      });
    }

    /**
     * Creates a canvas element with a sprite drawn on it.
     * @param {string} charKey
     * @param {string} frameKey
     * @param {number} scale
     * @returns {HTMLCanvasElement}
     */
    function makeSprite(charKey, frameKey, scale = PIXEL_SCALE) {
      const cols = 8;
      const rows = CHAR_FRAMES[charKey][frameKey].length;
      const canvas = document.createElement('canvas');
      canvas.width = cols * scale;
      canvas.height = rows * scale;
      canvas.style.imageRendering = 'pixelated';
      const ctx = canvas.getContext('2d');
      drawSprite(ctx, charKey, frameKey, 0, 0, scale);
      return canvas;
    }

    /**
     * Animated sprite component.
     * @param {string} charKey
     * @param {string[]} frameKeys - cycles through these frames
     * @param {number} fps
     * @param {number} scale
     * @returns {{ el: HTMLCanvasElement, stop: Function, setFrames: Function }}
     */
    function createAnimatedSprite(charKey, frameKeys, fps = 4, scale = PIXEL_SCALE) {
      const cols = 8;
      const rows = CHAR_FRAMES[charKey][frameKeys[0]].length;
      const canvas = document.createElement('canvas');
      canvas.width = cols * scale;
      canvas.height = rows * scale;
      canvas.style.imageRendering = 'pixelated';
      canvas.style.position = 'absolute';
      const ctx = canvas.getContext('2d');

      let currentFrames = frameKeys;
      let frameIdx = 0;
      let lastTime = 0;
      let rafId = null;
      let running = true;

      function tick(timestamp) {
        if (!running) return;
        if (timestamp - lastTime > 1000 / fps) {
          lastTime = timestamp;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawSprite(ctx, charKey, currentFrames[frameIdx % currentFrames.length], 0, 0, scale);
          frameIdx++;
        }
        rafId = requestAnimationFrame(tick);
      }

      rafId = requestAnimationFrame(tick);

      return {
        el: canvas,
        stop() { running = false; cancelAnimationFrame(rafId); },
        setFrames(newFrames) { currentFrames = newFrames; frameIdx = 0; },
        resume() { running = true; rafId = requestAnimationFrame(tick); },
      };
    }
  </script>
</body>
</html>
