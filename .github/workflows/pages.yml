name: Deploy GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify application
        run: node "$GITHUB_WORKSPACE/tests/run.cjs"
      - uses: actions/configure-pages@v6
      - name: Package only public application files
        run: |
          mkdir -p "$RUNNER_TEMP/spacer-site"
          cp "$GITHUB_WORKSPACE/index.html" "$GITHUB_WORKSPACE/game-world.js" "$GITHUB_WORKSPACE/location-layouts.js" "$RUNNER_TEMP/spacer-site/"
          cp -R "$GITHUB_WORKSPACE/assets" "$RUNNER_TEMP/spacer-site/assets"
          touch "$RUNNER_TEMP/spacer-site/.nojekyll"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/spacer-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
